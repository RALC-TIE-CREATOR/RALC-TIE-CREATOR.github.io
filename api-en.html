<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIE · H-16 · API REST</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --gold:#FFD700;--orange:#FF8C42;--red:#FF4455;--blue:#5BC8F5;--green:#44FF88;
  --bg:#000001;--bg2:rgba(5,5,15,0.92);--bg3:rgba(8,14,25,0.8);
  --text:#fff;--dim:#9090a8;--border:rgba(255,140,66,0.15);
  --mono:'Space Mono',monospace;--sans:'Syne',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;flex-direction:column;}
#bg-canvas{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:120vw;height:120vh;min-width:1200px;min-height:1200px;pointer-events:none;z-index:0;opacity:0.2;}

nav{position:relative;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:.85rem 2rem;background:rgba(0,0,1,0.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);flex-shrink:0;}
.nav-left{display:flex; align-items:center; gap:20px;}
.nav-logo{font-family:var(--mono);font-size:.85rem;font-weight:700;color:var(--gold);text-decoration:none;letter-spacing:2px;}
.orcid-link { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 0.75rem; color: #A6CE39; text-decoration: none; border: 1px solid rgba(166, 206, 57, 0.3); padding: 4px 12px; border-radius: 2px; transition: 0.3s; letter-spacing: 1px; }
.orcid-link:hover { background: rgba(166, 206, 57, 0.1); box-shadow: 0 0 15px rgba(166, 206, 57, 0.3); color: #fff; }

.nav-center{display:flex;gap:.5rem;}
.lang-btn{font-family:var(--mono);font-size:.7rem;font-weight:700;letter-spacing:2px;padding:.25rem .6rem;border-radius:4px;cursor:pointer;border:none;transition:all .2s;}
.lang-btn.active{color:#000;background:var(--gold);}
.lang-btn.inactive{color:var(--dim);border:1px solid var(--border);background:transparent;}
.lang-btn.inactive:hover{color:var(--gold);border-color:var(--gold);}
.nav-back{font-family:var(--mono);font-size:.75rem;color:var(--dim);text-decoration:none;letter-spacing:1px;transition:color .2s;}
.nav-back:hover{color:var(--orange);}

.strip{position:relative;z-index:10;background:rgba(0,0,1,0.8);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:.5rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;flex-wrap:wrap;gap:.4rem;}
.s-tag{font-family:var(--mono);font-size:.6rem;color:var(--orange);letter-spacing:3px;}
.s-title{font-family:var(--sans);font-size:.95rem;font-weight:800;}
.s-title span{color:var(--orange);}
.s-badge{font-family:var(--mono);font-size:.58rem;color:var(--green);background:rgba(68,255,136,.08);border:1px solid rgba(68,255,136,.25);border-radius:4px;padding:.18rem .55rem;letter-spacing:1px;}

#main{position:relative;z-index:10;flex:1;display:flex;overflow:hidden;min-height:0;}

/* LEFT: endpoint list */
#ep-col{width:260px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.ep-header{padding:.65rem .8rem;border-bottom:1px solid var(--border);flex-shrink:0;}
.ep-header-title{font-family:var(--mono);font-size:.6rem;color:var(--orange);letter-spacing:3px;margin-bottom:.4rem;text-transform:uppercase;}
.ep-base{font-family:var(--mono);font-size:.62rem;color:var(--dim);background:rgba(255,140,66,.06);border:1px solid rgba(255,140,66,.15);border-radius:6px;padding:.3rem .5rem;}
.ep-base span{color:var(--orange);}
#ep-list{flex:1;overflow-y:auto;padding:.5rem;display:flex;flex-direction:column;gap:.3rem;scrollbar-width:thin;}
.ep-item{background:var(--bg3);border:1px solid transparent;border-radius:8px;padding:.6rem;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;gap:.2rem;}
.ep-item:hover{border-color:rgba(255,140,66,.25);}
.ep-item.active{border-color:var(--orange);background:rgba(255,140,66,.08);}
.ep-method{font-family:var(--mono);font-size:.55rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.ep-method.get{color:var(--green);}
.ep-method.post{color:var(--blue);}
.ep-path{font-family:var(--mono);font-size:.62rem;color:var(--text);}

/* CENTER: docs + playground */
#doc-col{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:rgba(0,0,0,0.2);}
#ep-info{padding:1.2rem;border-bottom:1px solid var(--border);flex-shrink:0;}
.ep-info-row{display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem;}
.ep-info-method{font-family:var(--mono);font-size:.7rem;font-weight:900;letter-spacing:2px;padding:2px 6px;border-radius:4px;}
.ep-info-path{font-family:var(--mono);font-size:.9rem;color:var(--gold);font-weight:700;}
.ep-info-desc{font-size:.75rem;color:var(--dim);line-height:1.6;}
.ep-info-formula{margin-top:.8rem;padding:10px;background:rgba(255,255,255,0.02);border-radius:6px;}

.doc-tabs{display:flex;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.3);}
.doc-tab{font-family:var(--mono);font-size:.65rem;letter-spacing:1px;padding:.7rem 1.2rem;background:transparent;border:none;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;transition:.2s;}
.doc-tab.active{color:var(--orange);border-bottom-color:var(--orange);background:rgba(255,140,66,0.05);}

#tab-content{flex:1;overflow-y:auto;padding:1.2rem;scrollbar-width:thin;}

/* PLAYGROUND & RESPONSE */
.play-inputs{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1.2rem;max-width:500px;}
.play-row{display:flex;align-items:center;gap:1rem;}
.play-label{font-family:var(--mono);font-size:.65rem;color:var(--dim);width:100px;flex-shrink:0;}
.play-input{flex:1;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:6px;color:#fff;font-family:var(--mono);font-size:.75rem;padding:.5rem .8rem;outline:none;}
.play-input:focus{border-color:var(--orange);}
.btn-run{background:var(--orange);color:#000;border:none;border-radius:6px;font-family:var(--mono);font-size:.7rem;font-weight:800;letter-spacing:1px;padding:.6rem 1.5rem;cursor:pointer;transition:.2s;}
.btn-run:hover{background:#fff;box-shadow:0 0 15px var(--orange);}

.curl-box{background:rgba(0,0,0,0.7);border:1px solid var(--border);border-radius:8px;padding:1rem;font-family:var(--mono);font-size:0.68rem;color:#e0e0e0;line-height:1.6;position:relative;margin-bottom:1.5rem;white-space:pre;overflow-x:auto;}
.curl-copy{position:absolute;top:10px;right:10px;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--gold);font-size:0.55rem;padding:4px 8px;cursor:pointer;border-radius:4px;}
.curl-copy:hover{background:var(--gold);color:#000;}

#res-box{background:rgba(5,5,15,0.9);border:1px solid var(--border);border-radius:8px;padding:1rem;font-family:var(--mono);font-size:.7rem;color:#e0e0e0;line-height:1.6;white-space:pre;overflow-x:auto;margin-top:1rem;}
.json-key{color:var(--blue);}
.json-str{color:var(--green);}
.json-num{color:var(--orange);}

/* RIGHT: info */
#info-col{width:240px;flex-shrink:0;border-left:1px solid var(--border);padding:1rem;display:flex;flex-direction:column;gap:1rem;background:rgba(0,0,0,0.3);}
.i-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:.8rem;}
.i-title{font-family:var(--mono);font-size:.6rem;color:var(--orange);letter-spacing:2px;margin-bottom:.8rem;text-transform:uppercase;}
.i-row{display:flex;justify-content:space-between;padding:.3rem 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:.65rem;}
.i-key{color:var(--dim);font-family:var(--mono);}
.i-val{color:#fff;font-family:var(--mono);font-weight:700;}
.i-val.ok{color:var(--green);}

.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:var(--orange);color:#000;padding:.6rem 1.2rem;border-radius:6px;font-family:var(--mono);font-size:.75rem;font-weight:800;z-index:1000;display:none;animation:fup 0.3s;}
@keyframes fup{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<nav>
  <div class="nav-left">
    <a href="index.html" class="nav-logo">TIE / R@LC</a>
    <a href="https://orcid.org/0009-0008-4935-9010" target="_blank" class="orcid-link">
      <svg width="14" height="14" viewBox="0 0 256 256" fill="#A6CE39"><path d="M128,0A128,128,0,1,0,256,128,128,128,0,0,0,128,0ZM86.35,186.26H60V66.62H86.35Zm-13.17-133a15.35,15.35,0,1,1,15.35-15.35A15.35,15.35,0,0,1,73.18,53.28Zm120.35,76.51c0,28.8-21.23,49-55.83,49H110.8V66.62h32.22C175.61,66.62,193.53,88.75,193.53,129.79Zm-56.36-41v60.1h18c15.22,0,28.32-9.6,28.32-30.05s-13.1-30.05-28.32-30.05Z"/></svg>
      0009-0008-4935-9010
    </a>
  </div>
  <div class="nav-center">
    <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
    <button class="lang-btn inactive" id="btn-en" onclick="setLang('en')">EN</button>
  </div>
  <a href="lab-investigadores.html" class="nav-back" id="lnk-back">← LABORATORIO</a>
</nav>

<div class="strip">
  <span class="s-tag">H-16 · API REST</span>
  <span class="s-title" id="strip-title">API <span>PÚBLICA</span> REST · TIE</span>
  <span class="s-badge">⚡ SIMULADA · OPENAPI v3.0</span>
</div>

<div id="main">
  <div id="ep-col">
    <div class="ep-header">
      <div class="ep-header-title">ENDPOINTS</div>
      <div class="ep-base">BASE: <span>tie-api.ralc.mx</span></div>
    </div>
    <div id="ep-list"></div>
  </div>

  <div id="doc-col">
    <div id="ep-info">
      <div class="ep-info-row">
        <span class="ep-info-method" id="ep-m">GET</span>
        <span class="ep-info-path" id="ep-p">/v1/rotation-curve</span>
      </div>
      <div class="ep-info-desc" id="ep-d">—</div>
      <div class="ep-info-formula" id="ep-f"></div>
    </div>

    <div class="doc-tabs">
      <button class="doc-tab active" id="dt-params" onclick="setDocTab('params')">PARÁMETROS</button>
      <button class="doc-tab" id="dt-play" onclick="setDocTab('play')">▶ EJECUTAR</button>
      <button class="doc-tab" id="dt-resp" onclick="setDocTab('resp')">RESPUESTA</button>
      <button class="doc-tab" id="dt-code" onclick="setDocTab('code')">CURL / CODE</button>
    </div>

    <div id="tab-content"></div>
  </div>

  <div id="info-col">
    <div class="i-card">
      <div class="i-title">ESTADO API</div>
      <div class="i-row"><span class="i-key">Status</span><span class="i-val ok">● ONLINE</span></div>
      <div class="i-row"><span class="i-key">TIE Core</span><span class="i-val">v12.0</span></div>
      <div class="i-row"><span class="i-key">Auth</span><span class="i-val ok">Pública</span></div>
    </div>
    <div class="i-card">
      <div class="i-title">CONSTANTES</div>
      <div class="i-row"><span class="i-key">a₀</span><span class="i-val">1.082e-10</span></div>
      <div class="i-row"><span class="i-key">R (2π)</span><span class="i-val">6.2831...</span></div>
    </div>
    <div class="insight" style="background:rgba(255,140,66,0.05); border-left:3px solid var(--orange); padding:10px; border-radius:4px;">
      <p style="font-size:0.65rem; color:var(--dim); line-height:1.5;" id="insight-txt">
        API con <strong>física TIE v12.0 real</strong>.
      </p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const G=6.674e-11, C=2.998e8, H0=70e3/3.086e22, R_const=2*Math.PI, a0=C*H0/R_const;
const M_s=1.989e30, kpc=3.086e19;

function rotCurve(M_msun, r_kpc){
  const r=r_kpc*kpc, aN=G*M_msun*M_s/(r*r);
  const a_tie=Math.sqrt(aN*(aN+a0));
  return Math.sqrt(a_tie*r);
}

const ENDPOINTS = [
  {
    id:'rot-curve', method:'GET', path:'/v1/rotation-curve',
    nameES:'Curva de rotación', nameEN:'Rotation curve',
    descES:'Calcula v(r) TIE para una galaxia dada su masa bariónica. Sin materia oscura.',
    descEN:'Computes v(r) TIE for a galaxy given its baryonic mass. No dark matter.',
    formula:'v(r) = \\sqrt{r \\cdot \\sqrt{a_N(a_N + a_0)}}',
    inputs:[
      {key:'mass', label:'mass (M☉)', val:'1e11', type:'text'},
      {key:'r_kpc', label:'radius (kpc)', val:'20', type:'number'}
    ],
    run(p){
      const M=parseFloat(p.mass||1e11), r=parseFloat(p.r_kpc||20);
      const v=rotCurve(M,r);
      return {status:200, data:{mass_msun:M, r_kpc:r, v_kms:+(v/1e3).toFixed(2), unit:'km/s', a0_ms2:+a0.toExponential(4)}};
    }
  },
  {
    id:'horizon', method:'GET', path:'/v1/horizon',
    nameES:'Horizonte TIE', nameEN:'TIE Horizon',
    descES:'Calcula el radio de saturación rₕ (Horizonte Áureo).',
    descEN:'Computes the saturation radius rₕ (Golden Horizon).',
    formula:'r_h = 0.786 \\sqrt{GM/a_0}',
    inputs:[{key:'mass', label:'mass (M☉)', val:'6.5e9', type:'text'}],
    run(p){
      const M=parseFloat(p.mass||6.5e9);
      const rh = 0.786 * Math.sqrt(G*M*M_s/a0);
      return {status:200, data:{mass_msun:M, rh_km:+(rh/1e3).toExponential(4), rh_pc:+(rh/(3.086e16)).toExponential(4)}};
    }
  }
];

let lang='es', selEP=ENDPOINTS[0], docTab='params', lastRes=null;

function renderEPList(){
  const list=document.getElementById('ep-list');
  list.innerHTML='';
  ENDPOINTS.forEach(ep=>{
    const div=document.createElement('div');
    div.className='ep-item'+(ep===selEP?' active':'');
    div.onclick=()=>selectEP(ep);
    div.innerHTML=`<div class="ep-method ${ep.method.toLowerCase()}">${ep.method}</div>
      <div class="ep-path">${ep.path}</div>
      <div class="ep-desc">${lang==='es'?ep.nameES:ep.nameEN}</div>`;
    list.appendChild(div);
  });
}

function selectEP(ep){
  selEP=ep; lastRes=null;
  renderEPList();
  document.getElementById('ep-m').textContent=ep.method;
  document.getElementById('ep-m').className='ep-info-method '+(ep.method==='GET'?'get':'post');
  document.getElementById('ep-p').textContent=ep.path;
  document.getElementById('ep-d').textContent=lang==='es'?ep.descES:ep.descEN;
  katex.render(ep.formula, document.getElementById('ep-f'),{displayMode:true});
  setDocTab(docTab);
}

function setDocTab(t){
  docTab=t;
  ['params','play','resp','code'].forEach(id=>{
    const el = document.getElementById('dt-'+id);
    if(el) el.classList.toggle('active',id===t);
  });
  const c=document.getElementById('tab-content');
  if(t==='params'){
    c.innerHTML = `<p style="font-size:0.8rem; color:var(--dim); line-height:1.6;">${lang==='es'?'Definición de parámetros para el endpoint actual en formato JSON.':'Parameter definition for current endpoint in JSON format.'}</p>`;
  } else if(t==='play'){
    let ins='';
    selEP.inputs.forEach(inp=>{
      ins += `<div class="play-row"><span class="play-label">${inp.label}</span><input class="play-input" id="pi-${inp.key}" type="${inp.type}" value="${inp.val}"></div>`;
    });
    c.innerHTML = `<div class="play-inputs">${ins}</div><button class="btn-run" onclick="runEndpoint()">EJECUTAR</button>`;
  } else if(t==='code'){
    renderCodeSection(c);
  } else {
    c.innerHTML = lastRes ? `<div id="res-box">${JSON.stringify(lastRes,null,2).replace(/"([^"]+)":/g,'<span class="json-key">"$1"</span>:').replace(/: ([\d.e-]+)/g,': <span class="json-num">$1</span>').replace(/: "([^"]+)"/g,': <span class="json-str">"$1"</span>')}</div>` : `<p>${lang==='es'?'Sin resultados.':'No results yet.'}</p>`;
  }
}

function renderCodeSection(c){
  const params = selEP.inputs.map(i => `${i.key}=${i.val}`).join('&');
  const curl = `curl -X ${selEP.method} "https://tie-api.ralc.mx${selEP.path}?${params}"`;
  const py = `import requests\n\nurl = "https://tie-api.ralc.mx${selEP.path}"\nparams = {${selEP.inputs.map(i=>`"${i.key}": "${i.val}"`).join(', ')}}\n\nres = requests.get(url, params=params)\nprint(res.json())`;
  
  c.innerHTML = `
    <div style="font-family:var(--mono); font-size:0.6rem; color:var(--orange); letter-spacing:2px; margin-bottom:0.5rem;">CURL</div>
    <div class="curl-box">${curl}<button class="curl-copy" onclick="copyText(this)">COPY</button></div>
    <div style="font-family:var(--mono); font-size:0.6rem; color:var(--orange); letter-spacing:2px; margin-bottom:0.5rem;">PYTHON (REQUESTS)</div>
    <div class="curl-box">${py}<button class="curl-copy" onclick="copyText(this)">COPY</button></div>
  `;
}

function copyText(btn){
  const text = btn.parentElement.innerText.replace('COPY', '').trim();
  navigator.clipboard.writeText(text);
  btn.textContent = 'COPIED';
  setTimeout(()=>btn.textContent='COPY', 2000);
}

function runEndpoint(){
  const params={};
  selEP.inputs.forEach(i=>{ params[i.key]=document.getElementById('pi-'+i.key).value; });
  lastRes = selEP.run(params);
  setDocTab('resp');
  const t=document.getElementById('toast');
  t.textContent = lang==='es'?'Petición completada':'Request completed';
  t.style.display='block'; setTimeout(()=>t.style.display='none',2000);
}

function setLang(l){
  lang=l;
  document.getElementById('btn-es').className='lang-btn '+(l==='es'?'active':'inactive');
  document.getElementById('btn-en').className='lang-btn '+(l==='en'?'active':'inactive');
  document.getElementById('lnk-back').textContent = l==='es'?'← LABORATORIO':'← LABORATORY';
  document.getElementById('strip-title').innerHTML = l==='es'?'API <span>PÚBLICA</span> REST · TIE':'<span>PUBLIC</span> REST API · TIE';
  document.getElementById('insight-txt').innerHTML = l==='es' ? 'La API usa <strong>física TIE v12.0 real</strong> — a₀=cH₀/2π, rₕ=0.786√(GM/a₀), sin materia oscura.' : 'The API uses <strong>real TIE v12.0 physics</strong> — a₀=cH₀/2π, rₕ=0.786√(GM/a₀), no dark matter.';
  selectEP(selEP);
}

window.onload=()=>{
  setLang('es');
  const cv=document.getElementById('bg-canvas'), sc=new THREE.Scene(), cam=new THREE.PerspectiveCamera(60,1,.1,1000), ren=new THREE.WebGLRenderer({canvas:cv,alpha:true});
  ren.setSize(window.innerWidth, window.innerHeight); cam.position.z=5;
  const g=new THREE.BufferGeometry(), n=15000, p=new Float32Array(n*3);
  for(let i=0;i<n*3;i++) p[i]=(Math.random()-.5)*15;
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  sc.add(new THREE.Points(g,new THREE.PointsMaterial({size:.005,color:0xFF8C42,transparent:true,opacity:0.3})));
  (function a(){ requestAnimationFrame(a); sc.rotation.y+=.0005; ren.render(sc,cam); })();
};
</script>
<script src="axon-widget.js"></script>
</body>
</html>
