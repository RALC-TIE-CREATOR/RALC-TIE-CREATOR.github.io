<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXON // Neural Link Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        body {
            background: #000;
            color: #FFD700;
            font-family: 'Space Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        .container {
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 3rem;
            background: rgba(5, 5, 15, 0.9);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.1);
            position: relative;
        }
        .container::before {
            content: "SECURITY_ENCRYPTED";
            position: absolute;
            top: -10px;
            left: 20px;
            background: #000;
            padding: 0 10px;
            font-size: 0.6rem;
            letter-spacing: 2px;
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            letter-spacing: 5px;
        }
        .status {
            color: #44FF88;
            font-size: 0.8rem;
            margin-bottom: 2rem;
        }
        .status::before {
            content: "●";
            margin-right: 8px;
            animation: pulse 1s infinite;
        }
        p {
            font-size: 0.7rem;
            color: #a0a0b0;
            max-width: 400px;
            line-height: 1.6;
        }
        .redirect-btn {
            margin-top: 2rem;
            display: inline-block;
            padding: 10px 25px;
            border: 1px solid #FFD700;
            color: #FFD700;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: bold;
            transition: 0.3s;
        }
        .redirect-btn:hover {
            background: #FFD700;
            color: #000;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AXON_CORE</h1>
        <div class="status">SISTEMA OPERATIVO // VERCEL_NODE_ACTIVE</div>
        <p>Estás intentando acceder directamente a la infraestructura de procesamiento de la Teoría de la Infraestructura Espacial (TIE).</p>
        <p style="margin-top: 10px;">Este dominio actúa exclusivamente como túnel de seguridad para la Red de Laboratorios R@LC.</p>
        
        <a href="https://ralc-tie-creator.github.io/" class="redirect-btn">VOLVER AL FUERTE DIGITAL</a>
    </div>

    <script>
        // Redirección automática después de 10 segundos
        setTimeout(() => {
            window.location.href = "https://ralc-tie-creator.github.io/";
        }, 10000);
    </script>
</body>
</html>
