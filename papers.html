<script>
// ===== GLOSSARY =====
const GLOSARIO = [
  {
    id:'a0', symbol:'a₀', color:'#FFD700',
    term:'Transition acceleration',
    tagline:'The constant connecting galaxies and cosmos',
    cat:'fundamental',
    def:`<strong>a₀</strong> is the critical acceleration marking the boundary between Newtonian and TIE regimes. Below a₀, infrastructure physics emerges.<br><br>In TIE it is not a free parameter: it is <strong>derived directly from H₀ and 2π</strong>: a₀ = cH₀/2π.`,
    formula:'a_0 = \\frac{cH_0}{2\\pi} = 1.082 \\times 10^{-10}\\,\\text{m/s}^2',
    origin:`<em>1983</em> — Milgrom proposes MOND and empirically finds a₀ ≈ 1.2×10⁻¹⁰ m/s².<br><br><em>TIE</em> — the 2π factor emerges from treating cosmic expansion as a cycle: H₀ = 2π/T_universe.`,
    viz:'a0',
    links:[{txt:'a₀ calculator',href:'constante.html'},{txt:'2π factor',href:'2pi.html'}]
  },
  {
    id:'v0', symbol:'v₀', color:'#5BC8F5',
    term:'Fundamental velocity',
    tagline:'The T¹ velocity of the infrastructure',
    cat:'fundamental',
    def:`<strong>v₀ = c/2π</strong> is the fundamental velocity of the infrastructure. It is the asymptotic rotation velocity of any isolated galaxy: v_flat = (GM a₀)^(1/4).<br><br>Ontological hierarchy: T⁰ (∇φ₀) → T¹ (v₀) → T² (a₀).`,
    formula:'v_0 = \\frac{c}{2\\pi} = 47.715\\,\\text{km/s}',
    origin:`<em>TIE</em> — emerges from the postulate of complete cycles: light speed c, when expressed per cycle, gives v₀.`,
    viz:'vflat',
    links:[{txt:'Rotation curves',href:'curvas.html'}]
  },
  {
    id:'phi', symbol:'φ', color:'#00f5c8',
    term:'Synchronization field',
    tagline:'The dynamic fabric of space',
    cat:'fundamental',
    def:`<strong>φ</strong> is the scalar field describing the synchronization state of the infrastructure. At quantum scale it is ψ (wavefunction); at classical scale it generates gravitational perturbations h_ij.`,
    formula:'\\phi(x,t) = \\begin{cases} \\psi(x) & \\text{quantum} \\\\ h_{ij}(x,t) & \\text{classical} \\end{cases}',
    origin:`<em>TIE Ch. 7</em> — quantum-gravitational unification through the same field φ.`,
    viz:'phi',
    links:[{txt:'Field φ 3D',href:'campo-phi.html'}]
  },
  {
    id:'rh', symbol:'rₕ', color:'#FF8C42',
    term:'Golden TIE Horizon',
    tagline:'The horizon where φ (golden) emerges',
    cat:'agujeros',
    def:`<strong>rₕ</strong> is the radius where a_TIE(rₕ) = a₀. Solving u²+u−1=0 (u = a_N/a₀) yields the golden number φ = (1+√5)/2.<br><br>rₕ = √(φ·GM/a₀) ≈ 1.272√(GM/a₀). Grows as √M, not linearly.`,
    formula:'r_h = \\sqrt{\\dfrac{\\varphi \\cdot GM}{a_0}} \\approx 1.272\\,\\sqrt{\\dfrac{GM}{a_0}}',
    origin:`<em>TIE Ch. 10</em> — the quadratic equation emerges from the saturation condition of the infrastructure.`,
    viz:'rh',
    links:[{txt:'rₕ calculator',href:'agujeros.html'}]
  },
  {
    id:'lambda', symbol:'Λ', color:'#5BC8F5',
    term:'TIE cosmological constant',
    tagline:'No dark energy, no fine-tuning',
    cat:'cosmologia',
    def:`<strong>Λ_TIE = 2H₀²/c²</strong> is the background curvature of the infrastructure. Requires no dark energy or fine-tuning. 5% error vs. Planck 2018.`,
    formula:'\\Lambda_{\\text{TIE}} = \\frac{2H_0^2}{c^2} = 1.145 \\times 10^{-52}\\,\\text{m}^{-2}',
    origin:`<em>TIE Ch. 11</em> — derived from a₀ and S²×S¹ topology.`,
    viz:'lambda',
    links:[{txt:'Λ calculator',href:'constante.html'}]
  },
  {
    id:'rtrans', symbol:'rₜ', color:'#aaff00',
    term:'Transition radius',
    tagline:'Where curves become flat',
    cat:'galaxias',
    def:`<strong>r_trans = √(GM/a₀)</strong> is the radius where Newtonian acceleration equals a₀. Beyond this, gravity enters the TIE regime and rotation curves become flat.`,
    formula:'r_{\\text{trans}} = \\sqrt{\\frac{GM}{a_0}}',
    origin:`<em>From Step 3b of the Scalpel</em> — natural scale generated by translating kinematic a to phase.`,
    viz:'vflat',
    links:[{txt:'Rotation curves',href:'curvas.html'}]
  },
  {
    id:'r0', symbol:'r₀', color:'#b388ff',
    term:'Detachment scale',
    tagline:'The limit of bound structures',
    cat:'cosmologia',
    def:`<strong>r₀ = (GM/Λ_TIE c²)^(1/3)</strong> is the scale where gravitational attraction equals cosmic expansion. It is the maximum radius of a bound structure.`,
    formula:'r_0 = \\left(\\frac{GM}{\\Lambda_{\\text{TIE}} c^2}\\right)^{1/3}',
    origin:`<em>From Step 3b of the Scalpel</em> — second natural scale.`,
    viz:'lambda',
    links:[{txt:'Cosmology',href:'cosmologia.html'}]
  },
  {
    id:'omega_phi', symbol:'ω_φ', color:'#5BC8F5',
    term:'Field φ eigenfrequency',
    tagline:'The heartbeat of the infrastructure',
    cat:'fundamental',
    def:`<strong>ω_φ = √2 H₀</strong> is the natural frequency of the synchronization field φ. It can also be expressed as ω_φ = c√Λ_TIE.<br><br>Its value is ω_φ ≈ 3.21×10⁻¹⁸ rad/s, equivalent to a period of ~4.5 times the age of the universe.`,
    formula:'\\omega_\\phi = \\sqrt{2} H_0 = c\\sqrt{\\Lambda_{\\text{TIE}}} \\approx 3.21\\times10^{-18}\\,\\text{rad/s}',
    origin:`<em>TIE Ch. 12</em> — emerges from the Lagrangian as the effective mass of the field.`,
    viz:'lambda',
    links:[{txt:'TIE Lagrangian',href:'lagrangiano.html'}]
  },
  {
    id:'prefactor', symbol:'𝒜', color:'#9b59b6',
    term:'Dimensional prefactor',
    tagline:'The energy scale of the infrastructure',
    cat:'fundamental',
    def:`<strong>𝒜 = ħH₀²/c³</strong> is the dimensional prefactor giving correct units to the TIE Lagrangian. It is the only combination of ħ, H₀ and c with units of kg/m.`,
    formula:'\\mathcal{A} = \\frac{\\hbar H_0^2}{c^3} \\approx 2.01\\times10^{-95}\\,\\text{kg/m}',
    origin:`<em>TIE Ch. 12</em> — necessary because φ is dimensionless.`,
    viz:'lambda',
    links:[{txt:'TIE Lagrangian',href:'lagrangiano.html'}]
  }
];

const CATS_GLOS = {
  todos:'ALL', fundamental:'FUNDAMENTAL', agujeros:'BLACK HOLES',
  cosmologia:'COSMOLOGY', galaxias:'GALAXIES', predicciones:'PREDICTIONS'
};

let glosActiveCat = 'todos';
let glosOpenId = null;
let glosTabState = {};

function glosRenderFilters(){
  const wrap = document.getElementById('glos-filters');
  if(!wrap) return;
  wrap.innerHTML = '';
  Object.entries(CATS_GLOS).forEach(([k,v])=>{
    const btn = document.createElement('button');
    btn.className = 'glos-filter' + (k===glosActiveCat?' active':'');
    btn.textContent = v;
    btn.onclick = ()=>{ glosActiveCat=k; glosRenderFilters(); glosRenderGrid(); };
    wrap.appendChild(btn);
  });
}

function glosFilter(){
  glosRenderGrid();
}

function glosRenderGrid(){
  const grid = document.getElementById('glos-grid');
  if(!grid) return;
  const q = (document.getElementById('glos-search')?.value||'').toLowerCase();
  const items = GLOSARIO.filter(g=>{
    const matchCat = glosActiveCat==='todos'||g.cat===glosActiveCat;
    const matchQ = !q || g.term.toLowerCase().includes(q) || g.tagline.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  grid.innerHTML = '';
  if(items.length===0){
    grid.innerHTML='<div class="glos-no-results">— NO RESULTS —</div>';
    return;
  }
  items.forEach(g=>{
    const isOpen = glosOpenId === g.id;
    const div = document.createElement('div');
    div.className = 'glos-item' + (isOpen?' open':'');
    div.id = 'glos-'+g.id;
    div.innerHTML = `
      <div class="glos-header" onclick="glosToggle('${g.id}')">
        <div class="glos-symbol" style="color:${g.color}">${g.symbol}</div>
        <div class="glos-head-info">
          <div class="glos-term">${g.term}</div>
          <div class="glos-tagline">${g.tagline}</div>
        </div>
        <span class="glos-cat-badge" style="color:${g.color};border-color:${g.color}33;background:${g.color}0d">${CATS_GLOS[g.cat]||g.cat}</span>
        <span class="glos-arrow">▾</span>
      </div>
      <div class="glos-body">
        <div class="glos-tabs">
          <button class="glos-tab active" onclick="glosTab(event,'${g.id}','def')">DEFINITION</button>
          <button class="glos-tab" onclick="glosTab(event,'${g.id}','origen')">ORIGIN</button>
          <button class="glos-tab" onclick="glosTab(event,'${g.id}','viz')">VISUALIZATION</button>
        </div>
        <div id="glos-pane-def-${g.id}" class="glos-pane active">
          <div class="glos-def">${g.def}</div>
          <div class="glos-formula-box" id="glos-formula-${g.id}"></div>
          <div class="glos-links">${g.links.map(l=>`<a href="${l.href}" class="glos-link-btn">→ ${l.txt}</a>`).join('')}</div>
        </div>
        <div id="glos-pane-origen-${g.id}" class="glos-pane">
          <div class="glos-origin">${g.origin}</div>
        </div>
        <div id="glos-pane-viz-${g.id}" class="glos-pane">
          <div class="glos-viz">
            <canvas id="glos-canvas-${g.id}" height="160"></canvas>
            <span class="glos-viz-label" id="glos-viz-lbl-${g.id}"></span>
          </div>
        </div>
      </div>`;
    grid.appendChild(div);
    if(window.katex){
      try{ katex.render(g.formula, document.getElementById('glos-formula-'+g.id), {throwOnError:false,displayMode:true}); }catch(e){}
    }
  });
}

function glosToggle(id){
  glosOpenId = glosOpenId===id ? null : id;
  glosRenderGrid();
  if(glosOpenId){
    const tab = glosTabState[id]||'def';
    if(tab==='viz') setTimeout(()=>glosDrawViz(id),50);
    setTimeout(()=>{ const el=document.getElementById('glos-'+id); if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'}); },80);
  }
}

function glosTab(e, id, tab){
  e.stopPropagation();
  glosTabState[id]=tab;
  const body=document.getElementById('glos-'+id)?.querySelector('.glos-body');
  if(!body) return;
  body.querySelectorAll('.glos-tab').forEach((t,i)=>{ t.classList.toggle('active',['def','origen','viz'][i]===tab); });
  body.querySelectorAll('.glos-pane').forEach(p=>p.classList.remove('active'));
  const pane=document.getElementById('glos-pane-'+tab+'-'+id);
  if(pane){ pane.classList.add('active'); if(tab==='viz') setTimeout(()=>glosDrawViz(id),30); }
}

function glosDrawViz(id){
  const cv=document.getElementById('glos-canvas-'+id);
  if(!cv) return;
  cv.width=cv.clientWidth||500; const W=cv.width,H=160;
  const ctx=cv.getContext('2d'); ctx.clearRect(0,0,W,H);
  const gold='#FFD700',dim='rgba(255,255,255,0.15)';
  const drawAxes=()=>{ ctx.strokeStyle=dim;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(40,H-30);ctx.lineTo(W-20,H-30);ctx.stroke();ctx.beginPath();ctx.moveTo(40,H-30);ctx.lineTo(40,15);ctx.stroke(); };
  const lbl=document.getElementById('glos-viz-lbl-'+id);

  if(id==='a0'||id==='rtrans'){
    if(lbl) lbl.textContent='a₀ as regime boundary';
    drawAxes();
    ctx.strokeStyle='#5BC8F5';ctx.lineWidth=2;ctx.beginPath();
    for(let x=1;x<W-55;x++){const r=(x/(W-60))*5+0.1;const v=1/Math.sqrt(r);const py=H-30-(v*0.55*(H-50));x===1?ctx.moveTo(x+40,Math.max(15,py)):ctx.lineTo(x+40,Math.max(15,py));}
    ctx.stroke();
    ctx.strokeStyle=gold;ctx.lineWidth=2;ctx.beginPath();
    for(let x=1;x<W-55;x++){const r=(x/(W-60))*5+0.1;const aN=1/(r*r);const a=(aN+Math.sqrt(aN*aN+4*aN*0.3))/2;const v=Math.sqrt(a*r)*0.55;const py=H-30-(v*(H-50));x===1?ctx.moveTo(x+40,Math.max(15,py)):ctx.lineTo(x+40,Math.max(15,py));}
    ctx.stroke();
    const xa0=40+(0.25/(5)*(W-60));
    ctx.strokeStyle='rgba(255,215,0,0.4)';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(xa0,15);ctx.lineTo(xa0,H-30);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#5BC8F5';ctx.font='9px monospace';ctx.fillText('Newton',W-75,H-50);
    ctx.fillStyle=gold;ctx.fillText('TIE',W-45,38);
  }
  else if(id==='phi'){
    if(lbl) lbl.textContent='φ(r): TIE vs Newton';
    drawAxes();
    ctx.strokeStyle='#5BC8F5';ctx.lineWidth=2;ctx.beginPath();
    for(let x=1;x<W-55;x++){const r=0.3+(x/(W-60))*5;const phi=-1/r;const py=H-30+(phi*0.65*(H-45));x===1?ctx.moveTo(x+40,Math.min(H-31,Math.max(15,py))):ctx.lineTo(x+40,Math.min(H-31,Math.max(15,py)));}
    ctx.stroke();
    ctx.strokeStyle=gold;ctx.lineWidth=2;ctx.beginPath();
    for(let x=1;x<W-55;x++){const r=0.3+(x/(W-60))*5;const phi=-1/r*(1+r*0.12);const py=H-30+(phi*0.65*(H-45));x===1?ctx.moveTo(x+40,Math.min(H-31,Math.max(15,py))):ctx.lineTo(x+40,Math.min(H-31,Math.max(15,py)));}
    ctx.stroke();
    ctx.fillStyle='#5BC8F5';ctx.font='9px monospace';ctx.fillText('-GM/r',W-60,H-52);
    ctx.fillStyle=gold;ctx.fillText('φ_TIE',W-55,H-68);
  }
  else if(id==='rh'){
    if(lbl) lbl.textContent='rₕ (TIE) vs rₛ (GR)';
    drawAxes();
    ctx.strokeStyle='#5BC8F5';ctx.lineWidth=2;ctx.beginPath();
    for(let x=0;x<=W-60;x++){const logM=(x/(W-60))*6;const py=H-30-((logM/6))*(H-50);x===0?ctx.moveTo(x+40,py):ctx.lineTo(x+40,py);}
    ctx.stroke();
    ctx.strokeStyle=gold;ctx.lineWidth=2;ctx.beginPath();
    for(let x=0;x<=W-60;x++){const logM=(x/(W-60))*6;const logRh=logM*0.5+1.2;const py=H-30-((logRh/6))*(H-50);x===0?ctx.moveTo(x+40,Math.max(15,py)):ctx.lineTo(x+40,Math.max(15,py));}
    ctx.stroke();
    const xMc=40+(2/6)*(W-60);
    ctx.strokeStyle='rgba(255,68,85,0.5)';ctx.setLineDash([4,4]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(xMc,15);ctx.lineTo(xMc,H-30);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,68,85,0.8)';ctx.font='9px monospace';ctx.fillText('Mc',xMc-6,22);
    ctx.fillStyle='#5BC8F5';ctx.fillText('rₛ',W-30,35);
    ctx.fillStyle=gold;ctx.fillText('rₕ',W-30,58);
  }
  else if(id==='vflat'||id==='v0'){
    if(lbl) lbl.textContent='BTFR: 175 SPARC galaxies';
    drawAxes();
    let r=12345;
    for(let i=0;i<60;i++){r=(r*22695477+1)&0xffffffff;const logM=8.5+(r%100)/100*4;const logV=0.25*(logM-10)+2.1+((r>>8)%20-10)*0.025;const px=40+((logM-8.5)/4)*(W-60);const py=H-30-((logV-1.5)/1.2)*(H-50);ctx.beginPath();ctx.arc(px,py,2,0,Math.PI*2);ctx.fillStyle='rgba(91,200,245,0.65)';ctx.fill();}
    ctx.strokeStyle=gold;ctx.lineWidth=2;ctx.beginPath();
    for(let x=0;x<=W-60;x++){const logM=8.5+(x/(W-60))*4;const logV=0.25*(logM-10)+2.1;const px=x+40,py=H-30-((logV-1.5)/1.2)*(H-50);x===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}
    ctx.stroke();
    ctx.fillStyle=gold;ctx.font='9px monospace';ctx.fillText('v∝M^(1/4) · σ=0.07dex',40,22);
  }
  else if(id==='lambda'||id==='r0'||id==='omega_phi'||id==='prefactor'){
    if(lbl) lbl.textContent='QFT vs TIE vs observation error';
    const bars=[{lbl:'QFT',val:120,color:'#FF4455'},{lbl:'TIE',val:5.0,color:gold},{lbl:'Obs.',val:0.5,color:'#44FF88'}];
    const bw=55,gap=35,startX=45;
    bars.forEach((b,i)=>{
      const x=startX+i*(bw+gap);const barH=Math.max(4,(b.val/120)*(H-50));
      ctx.fillStyle=b.color+'22';ctx.strokeStyle=b.color;ctx.lineWidth=1.5;
      ctx.fillRect(x,H-30-barH,bw,barH);ctx.strokeRect(x,H-30-barH,bw,barH);
      ctx.fillStyle=b.color;ctx.font='9px monospace';
      ctx.fillText(b.lbl==='QFT'?'10¹²⁰×':b.lbl==='TIE'?'5.0%':'~0%',x+4,H-35-barH);
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillText(b.lbl,x+bw/2-12,H-15);
    });
  }
}

function initGlosario(){
  glosRenderFilters();
  glosRenderGrid();
}

// Initialize glossary on load
document.addEventListener('DOMContentLoaded', function() {
  initGlosario();
});
</script>

<!-- AXON Widget (preserved) -->
<script src="axon-widget.js"></script>

<!-- Re-initialize glossary after KaTeX -->
<script>
setTimeout(initGlosario, 500);
</script>
